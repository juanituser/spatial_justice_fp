[project]
name = "accessibility-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contextily>=1.7.1",
    "geopandas>=1.1.3",
    "libpysal",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "numpy<2",
    "pandana>=0.7",
    "typer>=0.25.1",
]

[project.scripts]
access = "analysis.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages =["src/analysis"]

